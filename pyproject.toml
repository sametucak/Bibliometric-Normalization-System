[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bibliometric-normalization-system"
version = "1.0.0"
description = "A Python toolkit for cleaning, normalizing, and disambiguating bibliometric data."
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Samet UCAK" }
]
dependencies = [
    "numpy>=1.26,<2.0",
    "pandas>=2.2,<2.3",
    "openpyxl>=3.1,<4.0",
    "rapidfuzz>=3.0,<4.0"
]

[tool.setuptools]
packages = ["src"]

[project.optional-dependencies]
dev = [
    "pytest>=7.4,<9.0"
]